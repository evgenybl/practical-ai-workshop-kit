name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: ${{ matrix.node }}

      - name: The tests
        run: node --test "tests/*.test.js"

      - name: The single-file workbook and every other generated file, rebuilt and compared
        run: node tools/build.js --check

      - name: Every constructed or recorded answer, and every model answer, through the command-line checker
        run: node tools/run-answers.js
